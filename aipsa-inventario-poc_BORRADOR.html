<meta charset="utf-8">
<title>Inventario AIPSA</title>
<style>
  :root{
    --bg:#EFEDE7; --container:#FDFCFA; --tpl-bg:#F7F5F0; --item-bg:#F1EFE8; --detail-bg:#D9D4C7; --chip-bg:#E1DDD2; --text:#26222B; --text2:#6A6472; --text3:#97919E;
    --border:#DAD6CF; --border2:#E9E6E1; --primary:#8A1BAD; --primary-bg:#F7F2F9; --link:#8A1BAD;
    --sider:#18161B; --sider-text:#A9A3B2; --sider-sel:rgba(166,38,204,.16); --brand:#A626CC;

    --rf-s:#0E7490; --rf-t:#0E6983; --rf-bg:#E1F2F7; --rf-b:#ABD6E3;
    --fin-s:#55525B; --fin-t:#55525B; --fin-bg:#EEEDF0; --fin-b:#D6D4DA;
    --baja-s:#B42323; --baja-t:#A82828; --baja-bg:#FBEAEA; --baja-b:#EDC3C3;
    --olive-s:#5A730B; --olive-t:#4E6409; --olive-bg:#F0F3DF; --olive-b:#D3DCA9;
    --magenta-s:#A31667; --magenta-t:#8E135A; --magenta-bg:#FBE9F3; --magenta-b:#EFC0DA;
    --white:#FFFFFF; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#131118; --container:#1F1B27; --tpl-bg:#1A1721; --item-bg:#16131C; --detail-bg:#09080D; --chip-bg:#2A2631; --text:#EDEBF1; --text2:#ABA8B4; --text3:#7B7587;
    --border:#3B3546; --border2:#2B2733; --primary:#B23BD6; --primary-bg:rgba(166,38,204,.14); --link:#CE8AE6;
    --sider:#18151D; --hover:rgba(166,38,204,.10); --zebra:#201D27;
    --contacto-s:#3B74DD; --contacto-t:#8FB3F2; --contacto-bg:rgba(70,120,225,.16); --contacto-b:rgba(110,150,235,.35);
    --pr-s:#C26A0E; --pr-t:#E3AC64; --pr-bg:rgba(195,125,35,.15); --pr-b:rgba(210,150,70,.35);
    --expo-s:#22914E; --expo-t:#7CCD9C; --expo-bg:rgba(45,155,85,.15); --expo-b:rgba(80,180,120,.32);
    --rf-s:#15829E; --rf-t:#6FC0D6; --rf-bg:rgba(25,145,175,.15); --rf-b:rgba(70,170,200,.32);
    --fin-s:#6B6873; --fin-t:#ABA8B4; --fin-bg:rgba(165,162,175,.13); --fin-b:rgba(165,162,175,.3);
    --baja-s:#C03434; --baja-t:#E28D8D; --baja-bg:rgba(205,70,70,.14); --baja-b:rgba(215,105,105,.32);
    --olive-s:#7C9A18; --olive-t:#BFD26A; --olive-bg:rgba(140,175,40,.15); --olive-b:rgba(160,190,70,.33);
    --magenta-s:#C22C82; --magenta-t:#EE94C4; --magenta-bg:rgba(200,55,140,.15); --magenta-b:rgba(215,90,165,.33);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#131118; --container:#1F1B27; --tpl-bg:#1A1721; --item-bg:#16131C; --detail-bg:#09080D; --chip-bg:#2A2631; --text:#EDEBF1; --text2:#ABA8B4; --text3:#7B7587;
    --border:#3B3546; --border2:#2B2733; --primary:#B23BD6; --primary-bg:rgba(166,38,204,.14); --link:#CE8AE6;
    --sider:#18151D; --hover:rgba(166,38,204,.10); --zebra:#201D27;
    --contacto-s:#3B74DD; --contacto-t:#8FB3F2; --contacto-bg:rgba(70,120,225,.16); --contacto-b:rgba(110,150,235,.35);
    --pr-s:#C26A0E; --pr-t:#E3AC64; --pr-bg:rgba(195,125,35,.15); --pr-b:rgba(210,150,70,.35);
    --expo-s:#22914E; --expo-t:#7CCD9C; --expo-bg:rgba(45,155,85,.15); --expo-b:rgba(80,180,120,.32);
    --rf-s:#15829E; --rf-t:#6FC0D6; --rf-bg:rgba(25,145,175,.15); --rf-b:rgba(70,170,200,.32);
    --fin-s:#6B6873; --fin-t:#ABA8B4; --fin-bg:rgba(165,162,175,.13); --fin-b:rgba(165,162,175,.3);
    --baja-s:#C03434; --baja-t:#E28D8D; --baja-bg:rgba(205,70,70,.14); --baja-b:rgba(215,105,105,.32);
    --olive-s:#7C9A18; --olive-t:#BFD26A; --olive-bg:rgba(140,175,40,.15); --olive-b:rgba(160,190,70,.33);

    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--link)} button{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:220px 1fr;height:100%;min-height:100%}
  .sider{background:var(--sider);color:var(--sider-text);overflow:auto;display:flex;flex-direction:column}
  .logo{margin:12px;background:var(--white);border-radius:10px;padding:8px 12px;display:flex;justify-content:center;align-items:center;gap:8px}

  .menu{padding:4px 0 16px}

  .grp.inert{opacity:.7}
  .item{display:flex;align-items:center;gap:10px;margin:2px 8px;padding:0 12px;height:36px;border-radius:8px;cursor:pointer;position:relative;color:var(--sider-text);border:0;background:transparent;width:calc(100% - 16px);text-align:left}
  .item:hover{background:rgba(255,255,255,.05);color:#fff}
  .item.sel{background:var(--sider-sel);color:#fff}
  .item.sel::before{content:'';position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--brand)}
  .item.inert{opacity:.45;cursor:default} .item.inert:hover{background:transparent;color:var(--sider-text)}
  .item .ico{width:16px;text-align:center;opacity:.8;font-size:12px}
  .item .badge{margin-left:auto;background:var(--baja-s);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;line-height:16px;font-variant-numeric:tabular-nums}
  .divider{height:1px;background:rgba(255,255,255,.08);margin:8px 16px}
  .subdiv{height:1px;background:rgba(255,255,255,.06);margin:6px 20px}
  .main{display:flex;flex-direction:column;min-width:0;height:100%}
  .header{background:var(--container);border-bottom:1px solid var(--border2);display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 24px;height:56px;flex-shrink:0;flex-wrap:wrap}
  .header .lbl{color:var(--text3);font-size:12px}
  .content{padding:24px;overflow:auto;flex:1}
  h1{font-size:23px;font-weight:700;margin:0}
  .h1row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px} .h1row .count{color:var(--text2);font-weight:700}
  .sub{color:var(--text2);margin:0 0 16px;max-width:90ch}
  .legend{background:none;border:0;padding:0;font:inherit;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
  .legend:hover{color:var(--text)}
  .detail h4 .legend{font-size:11px;font-weight:500;margin-left:8px}
  .ebgrid{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;padding:10px 12px;align-items:center;font-size:12px}
  .ebgrid label{color:var(--text2);font-weight:500}
  .ebgrid input[type=text]{width:100%;box-sizing:border-box;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--item-bg);color:var(--text);font:inherit;font-size:12px}
  .ebcamp{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,2fr) auto auto;gap:6px;align-items:center;padding:0 12px 6px}
  .ebcamp input[type=text]{padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--item-bg);color:var(--text);font:inherit;font-size:12px;min-width:0}
  .ebcamp label{font-size:11px;color:var(--text2);white-space:nowrap}
  .ebacts{display:flex;gap:6px;padding:4px 12px 10px;flex-wrap:wrap}
  .fexp{margin:0 0 8px;padding:7px 10px;font-size:11.5px;line-height:1.45;color:var(--text2);background:var(--container);border-left:3px solid var(--border2);border-radius:4px;max-width:none}
  td.cod{width:1%;white-space:nowrap;padding-right:4px} td.cod .code{font-size:10.5px}
  td.dsc{padding-left:6px;text-align:left;min-width:300px}
  .ftitle{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.04em}
  .detail{padding:10px 14px !important;font-size:12px}
  .detail h4{margin:0 0 5px;font-size:11px}
  .detail .inner{margin-bottom:8px;border-radius:6px}
  .detail th{padding:5px 10px;font-size:11px} .detail td{padding:4px 10px;font-size:12px}
  .detail .empty{padding:8px 10px;font-size:12px}
  .detail .note{font-size:11px}
  .fhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:4px}
  .fhead > div.fb{flex:1;min-width:280px}
  .kv.two{grid-template-columns:max-content 1fr max-content 1fr}
  .fimg{width:96px;height:96px;border-radius:10px;background:var(--fin-bg);border:1px solid var(--border2);display:grid;place-items:center;color:var(--text3);font-size:12px}
  .kv{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:3px 16px;padding:8px 12px;font-size:12px}
  .kv dt{color:var(--text2);font-weight:500;margin:0} .kv dd{margin:0}
  .kv .na{color:var(--text3)}
  .fresp{margin:0 0 5px;font-size:11px;color:var(--text2)}
  .obs{width:100%;min-height:90px;resize:vertical;border:0;outline:0;background:var(--item-bg);color:var(--text);font:inherit;font-size:12px;line-height:1.5;padding:10px 12px;display:block;box-sizing:border-box}
  .btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--container);color:var(--text);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff} .btn.primary:hover{opacity:.92;color:#fff}
  .btn.sm{height:28px;padding:0 10px;font-size:12px}
  .btn.text{border-color:transparent;background:transparent;color:var(--link);padding:0 6px} .btn.text:hover{background:var(--primary-bg)}
  .btn.danger{color:var(--baja-s);border-color:var(--baja-b)} .btn.danger.primary{background:var(--baja-s);border-color:var(--baja-s);color:#fff}
  select,input,textarea{height:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--container);color:var(--text);font:inherit;min-width:0}
  textarea{height:auto;padding:8px 10px}
  select.sm,input.sm{height:28px;font-size:12px}
  input:focus,select:focus,textarea:focus,.btn:focus-visible,.item:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px} .toolbar .spacer{flex:1}
  .rangebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--container);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;margin-bottom:16px}
  .rangebar .desc{color:var(--text3);font-size:12px;margin-left:auto}
  .card{background:var(--container);border:1px solid var(--border2);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .card .chead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
  .card .chead:hover{background:var(--hover)}
  .card .chead .name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .chead .meta{color:var(--text3);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
  .card .cbody{display:none;border-top:1px solid var(--border2)} .card.open>.cbody{display:block}
  .chev{display:inline-block;transition:transform .15s;color:var(--text3);font-size:11px} .card.open>.chead .chev{transform:rotate(90deg)}
  /* plantilla block */
  .tpl{border-top:1px solid var(--border2);background:var(--tpl-bg)} .tpl:first-child{border-top:0}
  .tpl .tblwrap table{background:var(--item-bg)}
  .tplhead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px 16px 10px;cursor:pointer}
  .tplhead:hover{background:var(--hover)}
  .tplhead .chev{margin-right:2px}
  .thumb{width:44px;height:44px;border-radius:8px;background:var(--fin-bg);border:1px solid var(--border2);display:grid;place-items:center;color:var(--text3);font-size:11px}
  .tplhead .tname{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tplhead .tdef{color:var(--text2);font-size:12px;margin-top:2px;display:flex;gap:6px 14px;flex-wrap:wrap}
  .tplhead .tdef b{color:var(--text3);font-weight:500}
  .tplhead .tacts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{text-align:left;font-weight:700;color:var(--text2);font-size:12px;padding:8px 14px;border-bottom:1px solid var(--border2);white-space:nowrap}
  td{padding:9px 14px;border-bottom:1px solid var(--border2);vertical-align:top}
  tr:last-child>td{border-bottom:0}
  tbody tr.row{cursor:pointer} tbody tr.row:hover>td,tbody tr.row.open>td{background:var(--hover)}
  td.fichacell{padding:0 14px 12px !important;background:var(--item-bg)} td.fichacell .detail{border:1px solid var(--border2);border-radius:10px}
  td.r,th.r{text-align:right} td.n,th.n{white-space:nowrap}
  .sec{color:var(--text3);font-size:12px} .name2{font-weight:600}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--text3)}
  .detail{background:var(--detail-bg);padding:14px 16px;border-bottom:1px solid var(--border2)}
  .detail h4{margin:0 0 8px;font-size:12px;color:var(--text);font-weight:700}
  .detail .inner{background:var(--container);border:1px solid var(--border2);border-radius:8px;overflow:hidden;margin-bottom:12px}
  .detail .inner thead{background:var(--container)}
  .detail .inner tbody{background:var(--item-bg)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:900px){.grid2{grid-template-columns:1fr}}
  .tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;line-height:1}
  .tag.fill{color:#fff}
  .t-contacto.fill{background:var(--contacto-s)} .t-contacto{background:var(--contacto-bg);color:var(--contacto-t);border-color:var(--contacto-b)}
  .t-pr.fill{background:var(--pr-s)} .t-pr{background:var(--pr-bg);color:var(--pr-t);border-color:var(--pr-b)}
  .t-expo.fill{background:var(--expo-s)} .t-expo{background:var(--expo-bg);color:var(--expo-t);border-color:var(--expo-b)}
  .t-rf.fill{background:var(--rf-s)} .t-rf{background:var(--rf-bg);color:var(--rf-t);border-color:var(--rf-b)}
  .t-fin.fill{background:var(--fin-s)} .t-fin{background:var(--fin-bg);color:var(--fin-t);border-color:var(--fin-b)}
  .t-baja.fill{background:var(--baja-s)} .t-baja{background:var(--baja-bg);color:var(--baja-t);border-color:var(--baja-b)}
  .t-olive{background:var(--olive-bg);color:var(--olive-t);border-color:var(--olive-b)}
  .t-magenta{background:var(--magenta-bg);color:var(--magenta-t);border-color:var(--magenta-b)}
  .alert{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 14px;margin-bottom:12px;border:1px solid}
  .alert.info{background:var(--contacto-bg);border-color:var(--contacto-b)} .alert.warn{background:var(--pr-bg);border-color:var(--pr-b)} .alert.err{background:var(--baja-bg);border-color:var(--baja-b)}
  .alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
  .alert.info .dot{background:var(--contacto-s)} .alert.warn .dot{background:var(--pr-s)} .alert.err .dot{background:var(--baja-s)}
  .alert .body{flex:1} .alert b{font-weight:600}
  .empty{padding:24px 16px;text-align:center;color:var(--text3)}
  .note{color:var(--text3);font-size:12px;margin:6px 0 0}
  .overlay{position:fixed;inset:0;background:rgba(38,34,43,.45);display:none;align-items:flex-start;justify-content:flex-end;overflow:auto;z-index:50}
  .overlay.on{display:flex}
  .modal{background:var(--container);width:560px;max-width:100%;min-height:100%;box-shadow:-8px 0 30px rgba(0,0,0,.18);border-left:1px solid var(--border2);display:flex;flex-direction:column}
  .modal.center{min-height:0;margin:48px auto;border-radius:12px;border:1px solid var(--border2);width:520px}
  .modal h2{font-size:16px;margin:0;padding:18px 24px 4px}
  .modal .desc{color:var(--text2);padding:0 24px 12px;margin:0}
  .modal .mbody{padding:0 24px 8px;flex:1}
  .field{margin-bottom:12px} .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px} .field label .opt{color:var(--text3)}
  .field select,.field input,.field textarea{width:100%}
  .field .hint{font-size:12px;color:var(--text3);margin-top:4px} .field .err{font-size:12px;color:var(--baja-t);margin-top:4px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} @media (max-width:560px){.fgrid{grid-template-columns:1fr}}
  .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px 20px;border-top:1px solid var(--border2)}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border2);margin:4px 24px 14px;overflow-x:auto}
  .tab{padding:8px 12px;cursor:pointer;color:var(--text2);border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;white-space:nowrap}
  .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
  .radio{display:flex;gap:6px;flex-wrap:wrap} .radio label{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12.5px;margin:0}
  .radio input{width:auto;height:auto} .radio label.on{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
  .check{display:flex;align-items:center;gap:8px;margin-bottom:10px} .check input{width:auto;height:auto}
  .toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(560px,calc(100% - 32px))}
  .toast{background:var(--container);color:var(--text);border:1px solid var(--border2);box-shadow:var(--shadow);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--expo-s);flex-shrink:0}
  .toast .undo{margin-left:auto;color:var(--link);background:none;border:0;cursor:pointer;font-weight:500}
  .card.bajo{background:var(--baja-bg);border-color:var(--baja-b)} .card.bajo>.cbody{border-top-color:var(--baja-b)}
  .card.bajo .chead:hover{background:color-mix(in srgb, var(--baja-s) 9%, transparent)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--chip-bg)}
  .seg button{border:0;background:transparent;color:var(--text2);padding:6px 14px;font-size:13px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--border)}
  .seg button.on{background:var(--container);color:var(--primary);font-weight:700}
  .kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start}

  const sinEv = x => !x.ev;
  VARIANTS.forEach(v=>{
    if(tplOf(v).kind==='KIT') return;
    const h = hash(v.id), stock = v.stock||[]; if(!stock.length) return;
    const principal = stock.slice().sort((a,b)=>b.qty-a.qty)[0].sec;
    const quien = sec(principal).resp || 'Sin responsable';
    const ya = LIBRO.filter(x=>x.ref===v.id);
    comprasPrevias(v).forEach(c=>{

      LIBRO.push({id:nextLibroId++, fecha:c.fecha, tipo:'COMPRA', ref:v.id, sec:principal, qty:c.qty, nota:`${c.proveedor} · ${c.factura}`, quien:'Compras'});
    });
    const base = v.costoAt || '2026-09-01';
    if(v.receta){
      LIBRO.push({id:nextLibroId++, fecha:addDays(base,3+h%9), tipo:'PRODUCCION', ref:v.id, sec:principal, qty:10+h%20, lote:`L-${40+h%40}`, quien});
    }
    LIBRO.push({id:nextLibroId++, fecha:addDays('2026-09-20',h%10), tipo:'CONSUMO', ref:v.id, sec:principal, qty:-(1+h%4), nota:'Uso en taller', quien});
    LIBRO.push({id:nextLibroId++, fecha:addDays('2026-10-02',h%12), tipo:'AJUSTE', ref:v.id, sec:principal, qty:(h%2?1:-1), nota:'Ajuste por conteo físico', quien});
    if(stock.length>1){
      const o = stock.find(x=>x.sec!==principal).sec, q = 2+h%5, f = addDays('2026-10-08',h%8);
      LIBRO.push({id:nextLibroId++, fecha:f, tipo:'TRANSFERENCIA', ref:v.id, sec:principal, qty:-q, lote:`T-${20+h%30}`, quien});
      LIBRO.push({id:nextLibroId++, fecha:f, tipo:'TRANSFERENCIA', ref:v.id, sec:o, qty:q, lote:`T-${20+h%30}`, quien:sec(o).resp||'Sin responsable'});
    }
  });
})();

// búsqueda: por subtipo (nombre/código) y por descripción del ítem (atributos como "Largo 1 m")
const normTxt = s => (s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const searchTokens = q => normTxt(q).trim().split(/\s+/).filter(Boolean);
function hayIncludes(haystack, tokens){
  if(!tokens.length) return true;
  const h = normTxt(haystack), hs = h.replace(/\s+/g,'');
  return tokens.every(tok => h.includes(tok) || hs.includes(tok));
}
const tplHaystack = t => `${t.nombre} ${t.id}`;
const varHaystack = (t,v) => `${t.nombre} ${t.id} ${v.id} ${Object.entries(v.attrs).map(([k,val])=>k+' '+val).join(' ')} ${vColor(v)||''} ${v.nombre||''}`;
function tplMatchesSearch(t, tokens){ if(!tokens.length) return true; if(hayIncludes(tplHaystack(t), tokens)) return true; return variantsOf(t).some(v=>hayIncludes(varHaystack(t,v), tokens)); }
function tplVariantsForSearch(t, tokens){ const vs = variantsOf(t).sort((a,b)=>a.id.localeCompare(b.id)); if(!tokens.length || hayIncludes(tplHaystack(t), tokens)) return vs; return vs.filter(v=>hayIncludes(varHaystack(t,v), tokens)); }

function ventanaEvento(ev){ return {from: ev.armado, to: ev.desarmeFin || ev.desarme}; }
function evEnVentana(ev){ if(!state.desde && !state.hasta) return true; const w = ventanaEvento(ev); return w.from <= (state.hasta || '9999-12-31') && w.to >= (state.desde || '0000-01-01'); }
function estadoEn(ev, ref){
  const res = ev.reservas.find(r=>r.ref===ref); if(!res) return null;
  const rows = LIBRO.filter(m=>m.ev===ev.id && m.ref===ref);
  const desp = -rows.filter(m=>m.tipo==='DESPACHO').reduce((a,m)=>a+m.qty,0);
  const rein = rows.filter(m=>m.tipo==='REINGRESO').reduce((a,m)=>a+m.qty,0);
  const cons = -rows.filter(m=>m.tipo==='CONSUMO').reduce((a,m)=>a+m.qty,0);
  if(desp===0 && cons===0) return 'Reservado';
  if(cons>0 && desp===0) return 'Consumido';
  if(desp - rein - cons > 0) return 'En uso';
  return rein>0 ? 'Reingresado' : 'Consumido';
}
function reservado(ref){ return EVENTOS.filter(evEnVentana).reduce((a,ev)=>{ const r = ev.reservas.find(x=>x.ref===ref); return a + (r && estadoEn(ev,ref)==='Reservado' ? r.qty : 0); },0); }
const disponible = v => fisico(v) - reservado(v.id);
// kits: costo = A (ítems físicos) + B (mano de obra) + C (logística)
const kitCostoA = v => (v.comp||[]).reduce((a,c)=>{ const x = costo(variant(c.ref)); return x==null||a==null ? null : a + x*c.qty; },0);
const kitCostoB = v => (v.mo||[]).reduce((a,x)=>a+x.costo,0);
const kitCostoC = v => (v.log||[]).reduce((a,x)=>a+x.costo,0);
// reserva de un kit: nace del presupuesto (que se compone de kits) y reserva a su vez los componentes
const kitReservas = v => EVENTOS.filter(evEnVentana).map(ev=>({ev, r:(ev.kits||[]).find(x=>x.ref===v.id)})).filter(x=>x.r);
const kitReservado = v => kitReservas(v).reduce((a,x)=>a+x.r.qty,0);
function costo(v){
  const t = tplOf(v);
  if(t.kind==='KIT'){ if(!(v.comp||[]).length) return null; const a = kitCostoA(v); return a==null ? null : a + kitCostoB(v) + kitCostoC(v); }
  if(v.receta) return v.receta.reduce((a,c)=>{ const x = costo(variant(c.raw)); return x==null||a==null ? null : a + x*c.qty; },0);
  return v.costo ?? null;
}
const costoFuente = v => tplOf(v).kind==='KIT' ? 'derivado de los componentes' : v.receta ? 'derivado de la receta' : v.costoAt ? `última compra ${fdate(v.costoAt)}` : 'sin compras registradas';
const fisicoTpl = t => variantsOf(t).reduce((a,v)=>a+fisico(v),0);
function alertaGlobal(v){ return v.minG != null && fisico(v) <= v.minG; }
function alertasSeccion(v){ return (v.stock||[]).filter(r=>r.min!=null && r.qty<=r.min).map(r=>{ const otras = v.stock.filter(o=>o.sec!==r.sec && o.qty > (o.min??0)).sort((a,b)=>b.qty-a.qty); return {row:r, desde: otras[0]||null}; }); }
const solicitudAbierta = ref => SOLICITUDES.some(s=>s.ref===ref && (s.estado==='Solicitada'||s.estado==='Cotizada'));
function kitCapacidad(v, conVentana){ let min=Infinity, cuello=null; (v.comp||[]).forEach(c=>{ const v=variant(c.ref); const base = conVentana ? disponible(v) : fisico(v); const n = Math.floor(base/c.qty); if(n<min){min=n; cuello=v;} }); return {n:min===Infinity?0:min, cuello}; }
const genCode = (t, attrs) => [t.id, ...t.ejes.map(e => (e.valores.find(x=>x.label===attrs[e.nombre])||{}).code)].filter(Boolean).join('-');

const TIPO_FAM = {COMPRA:'expo', PRODUCCION:'rf', PRODUCCION_REV:'fin', DESPACHO:'contacto', REINGRESO:'expo', CONSUMO:'baja', TRANSFERENCIA:'fin', AJUSTE:'pr'};
const TIPO_LBL = {COMPRA:'Compra', PRODUCCION:'Producción', PRODUCCION_REV:'Producción revertida', DESPACHO:'Despacho', REINGRESO:'Reingreso', CONSUMO:'Consumo', TRANSFERENCIA:'Transferencia', AJUSTE:'Ajuste'};
const tipoTag = t => tag(TIPO_LBL[t], TIPO_FAM[t]);
const estadoTag = st => st==='Reservado' ? tag('Reservado','pr') : st==='En uso' ? tag('En uso','contacto',true) : st==='Reingresado' ? tag('Reingresado','expo') : tag('Consumido','fin');

const kitHay = (t,v) => `${t.nombre} ${t.id} ${t.grupo||''} ${v.id} ${v.nm||''}`;
const kitTplHay = t => `${t.nombre} ${t.id} ${t.grupo||''}`;
const kitConDef = v => (v.comp||[]).length > 0;
function kitDetail(v, k, m){
  const def = kitConDef(v), res = kitReservas(v);
  const concept = (rows) => rows.map(x=>`<tr><td>${x.c}</td>${m?`<td class="r n">${money(x.costo)}</td>`:''}</tr>`).join('');
  const sinDef = '<div class="empty">Todavía sin definir: la planilla de origen no trae este dato.</div>';
  let top = '', tablaA = sinDef, tablaB = sinDef, tablaC = sinDef, cuello = '';
  if(def){
    const f = kitCapacidad(v,false), d = kitCapacidad(v,true);
    const a = kitCostoA(v), b = kitCostoB(v), c = kitCostoC(v);
    top = m ? `<h4>Costo de reposición</h4><div style="margin-bottom:14px"><b style="font-size:18px">${money(costo(v))}</b> <span class="sec">= A ${money(a)} + B ${money(b)} + C ${money(c)} · derivado de los componentes</span></div>` : '';
    tablaA = `<div class="tblwrap"><table>
      <thead><tr><th>Componente</th><th>Capa</th><th class="r">Por kit</th><th class="r">Físico</th><th class="r">Reservado</th><th class="r">Disponible</th><th class="r">Kits que permite</th>${m?'<th class="r">Costo aportado</th>':''}</tr></thead>
      <tbody>${v.comp.map(x=>{const cv=variant(x.ref); const fi=fisico(cv), re=reservado(cv.id); return `<tr><td>${vLabel(cv)} <span class="code">${cv.id}</span></td><td>${kindTag(tplOf(cv).kind)}</td><td class="r n">${fmt(x.qty)} ${unidad(cv)}</td><td class="r n">${fmt(fi)}</td><td class="r n">${re?fmt(re):'—'}</td><td class="r n">${fmt(fi-re)}</td><td class="r n">${fmt(Math.floor((fi-re)/x.qty))}</td>${m?`<td class="r n">${money(costo(cv)==null?null:costo(cv)*x.qty)}</td>`:''}</tr>`;}).join('')}</tbody>
    </table></div>`;
    cuello = `<p class="sec" style="margin:-4px 0 12px">Cuello de botella · físico: ${f.cuello?vLabel(f.cuello):'—'} · disponible: ${d.cuello?vLabel(d.cuello):'—'}</p>`;
    const tb = (rows) => `<div class="tblwrap"><table><thead><tr><th>Concepto</th>${m?'<th class="r">Costo por kit</th>':''}</tr></thead><tbody>${concept(rows)}</tbody></table></div>`;
    tablaB = tb(v.mo||[]); tablaC = tb(v.log||[]);
  }
  return `<div class="detail">
    ${top}
    <h4>A · Ítems físicos (materias primas y materiales)</h4><div class="inner">${tablaA}</div>
    ${cuello}
    <h4>B · Mano de obra</h4><div class="inner">${tablaB}</div>
    <h4>C · Logística</h4><div class="inner">${tablaC}</div>
    <h4>Reservado en presupuestos</h4>
    <div class="inner">${res.length?`<div class="tblwrap"><table>
      <thead><tr><th>Evento</th><th>Armado → desarme</th><th class="r">Cantidad</th></tr></thead>
      <tbody>${res.map(x=>`<tr><td>${x.ev.nombre} <span class="sec">· ${x.ev.cliente}</span></td><td class="sec">${fdate(x.ev.armado)} → ${fdate(x.ev.desarmeFin||x.ev.desarme)}</td><td class="r n">${fmt(x.r.qty)}</td></tr>`).join('')}</tbody>
    </table></div>`:'<div class="empty">Ningún presupuesto vivo reserva este kit.</div>'}</div>
  </div>`;
}
function pageKits(){
  const tokens = searchTokens(state.qk);
  const tplsAll = TEMPLATES.filter(t=>t.kind==='KIT');
  const nItems = VARIANTS.reduce((a,v)=>a+(tplOf(v).kind==='KIT'?1:0),0);
  const varsOf = new Map(tplsAll.map(t=>[t.id,[]])); VARIANTS.forEach(v=>{ const l=varsOf.get(v.tpl); if(l) l.push(v); });
  // con búsqueda: por subfamilia (nombre/código/grupo) o por descripción de ítem; sin búsqueda: todo
  const vsFor = t => { const all = varsOf.get(t.id); if(!tokens.length || hayIncludes(kitTplHay(t),tokens)) return all; return all.filter(v=>hayIncludes(kitHay(t,v),tokens)); };
  const tpls = tokens.length ? tplsAll.filter(t=>vsFor(t).length) : tplsAll;
  const rubros = RUBRO_ORDER.filter(r=>tpls.some(k=>k.rubro===r));
  const w = canWrite(), m = canMontos(), ncols = 6;
  return `
    ${h1row('Kits', `${tplsAll.length} subfamilias · ${nItems} ítems`, `Familia → subfamilia → ítem. Un kit no tiene stock propio: se compone de A) ítems físicos, B) mano de obra y C) logística. Se muestra cuántos se podrían armar y cuántos están reservados.`, 'kits')}
    <div class="toolbar"><input class="sm" placeholder="Buscar subfamilia, código o descripción (ej. panel 1m x 2m)…" style="min-width:320px" aria-label="Buscar kits" id="qk" value="${state.qk||''}"><span class="spacer"></span>${w?'<button class="btn" data-newtpl="KIT">Nueva subfamilia</button>':''}</div>
    ${rangeBar()}
    <div class="alert info"><span class="dot"></span><div class="body">La reserva de un kit nace en el <b>presupuesto</b> (que se compone de kits) y reserva a su vez los materiales y materias primas que lo componen: es el camino inverso al de las compras.</div></div>
    ${rubros.length?'':'<div class="empty">Sin resultados para esa búsqueda.</div>'}
    ${rubros.map(r=>{ const rows = tpls.filter(k=>k.rubro===r); const open = tokens.length ? true : (state.openFam['KIT'+r] ?? false); return `<div class="card${open?' open':''}" data-fam="KIT${r}">
      <div class="chead"><div class="name">${r} <span class="chev">▶</span></div><div class="meta">${rows.length} subfamilia${rows.length===1?'':'s'}</div></div>
      <div class="cbody">${open?rows.map(k=>{ const vs = vsFor(k); const open = tokens.length ? true : (state.openTpl[k.id] ?? false); const hayRes = vs.some(v=>kitReservado(v)>0); return `<div class="tpl" data-tpl="${k.id}">
        <div class="tplhead">
          <div class="thumb">img</div>
          <div>
            <div class="tname"><span class="chev" style="${open?'transform:rotate(90deg)':''}">▶</span> ${k.nombre} <span class="code">${k.id}</span> ${hayRes?tag('Reservado','pr'):''}</div>
            <div class="sec" style="margin-top:2px">${k.grupo?k.grupo+' · ':''}${vs.length} ítem${vs.length===1?'':'s'}</div>
          </div>
          <div class="tacts">${w?`<button class="btn text sm" data-edittpl="${k.id}">Editar subfamilia</button>`:`<button class="btn text sm" data-edittpl="${k.id}">Ver subfamilia</button>`}</div>
        </div>
        ${open?`<div class="tblwrap"><table>
          <thead><tr><th>Código</th><th>Descripción</th><th class="r">Armables (físico)</th><th class="r">Armables (disponible)</th><th class="r">Reservado</th><th></th></tr></thead>
          <tbody>${vs.length?vs.map(v=>{ const def=kitConDef(v), f=def?kitCapacidad(v,false):null, d=def?kitCapacidad(v,true):null, res=kitReservado(v), ro=!!state.openRow[v.id]; return `<tr class="row" data-row="${v.id}">
            <td><span class="code" style="color:var(--text)">${v.id}</span> ${res?tag('Reservado','pr'):''}</td>
            <td>${vAttrs(v)}</td>
            <td class="r n">${def?fmt(f.n):'—'}</td><td class="r n" style="${def&&d.n===0?'color:var(--baja-t);font-weight:600':''}">${def?fmt(d.n):'—'}</td>
            <td class="r n">${res?fmt(res):'—'}</td>
            <td class="r n"><span class="chev" style="${ro?'transform:rotate(90deg)':''}">▶</span></td></tr>
            ${ro?`<tr><td colspan="${ncols}" style="padding:0">${kitDetail(v,k,m)}</td></tr>`:''}`;}).join(''):`<tr><td colspan="${ncols}" class="empty">La subfamilia no tiene ítems todavía.</td></tr>`}</tbody>
        </table></div>`:''}
      </div>`;}).join(''):''}</div></div>`;}).join('')}
  `;
}

// acordeón genérico anidado (almacén → materias primas / materiales → categoría); todo cerrado por defecto
const acc = (key, lvl, head, meta, body) => { const open = state.openAcc[key] ?? false; return `<div class="acc l${lvl}${open?' open':''}" data-acc="${key}"><div class="acchead"><span class="chev">▶</span><span class="accname">${head}</span><span class="accmeta">${meta}</span></div>${open?`<div class="accbody">${body}</div>`:''}</div>`; };
const nItems = n => `${n} ítem${n===1?'':'s'}`;
function almacenBlock(s){
  const rows = VARIANTS.filter(v=>v.stock.some(r=>r.sec===s.id) && ['RAW','SUPPLY','MATERIAL'].includes(tplOf(v).kind));
  const grupo = (kinds, label, kk) => {
    const rs = rows.filter(v=>kinds.includes(tplOf(v).kind));
    const fams = [...new Set(rs.map(v=>tplOf(v).fam))].sort((a,b)=>FAM_ORDER.indexOf(a)-FAM_ORDER.indexOf(b));
    const body = fams.length ? fams.map(f=>{
      const fr = rs.filter(v=>tplOf(v).fam===f).sort((a,b)=>a.id.localeCompare(b.id));
      const tabla = `<div class="inner"><div class="tblwrap"><table><thead><tr><th>Plantilla · variante</th><th class="r">Físico</th><th class="r">Mín. almacén</th><th>QR</th></tr></thead><tbody>${fr.map(v=>{ const r=v.stock.find(x=>x.sec===s.id); const t=tplOf(v); return `<tr><td>${vLabel(v)} <span class="code">${v.id}</span></td><td class="r n" style="${r.min!=null&&r.qty<=r.min?'color:var(--pr-t);font-weight:600':''}">${fmt(r.qty)} ${t.unidad}</td><td class="r n">${r.min!=null?fmt(r.min):'—'}</td><td class="code">${r.qr??'—'}</td></tr>`; }).join('')}</tbody></table></div></div>`;
      return acc(`${s.id}|${kk}|${f}`, 3, f, nItems(fr.length), tabla);
    }).join('') : '<div class="empty">Sin ítems en este almacén.</div>';
    return acc(`${s.id}|${kk}`, 2, label, nItems(rs.length), body);
  };
  const head = `<b>${DEPARTAMENTOS[s.dpto]}</b> <span class="sec">Responsable:</span> ${s.resp ?? tag('Sin responsable','pr')} ${canWrite()?`<button class="btn text sm" data-resp="${s.id}">${s.resp?'Cambiar':'Asignar'}</button>`:''}`;
  return acc(`alm|${s.id}`, 1, head, nItems(rows.length), grupo(['RAW','SUPPLY'],'Materias primas','MP') + grupo(['MATERIAL'],'Materiales','MAT'));
}

function pageDepositos(){

    <div class="toolbar"><span class="spacer"></span>${canWrite()?'<button class="btn" id="nuevaSeccion">Nuevo almacén</button><button class="btn primary" id="nuevoDep">Nuevo depósito</button>':''}</div>
    ${DEPOSITOS.map(d=>{

// depósito transitorio: cada evento agrupa su material igual que los depósitos permanentes (materias primas / materiales → categoría)
function eventoGrupo(ev, kinds, label, kk){

  const fams = [...new Set(rs.map(r=>tplOf(variant(r.ref)).fam))].sort((a,b)=>FAM_ORDER.indexOf(a)-FAM_ORDER.indexOf(b));
  const body = fams.length ? fams.map(f=>{
    const fr = rs.filter(r=>tplOf(variant(r.ref)).fam===f);
    const tabla = `<div class="inner"><div class="tblwrap"><table>
      <thead><tr><th>Plantilla · variante</th><th class="r">Reservado</th><th>Estado físico</th><th>Movimientos</th><th></th></tr></thead>
      <tbody>${fr.map(r=>{ const v=variant(r.ref); const t=tplOf(v); const st=estadoEn(ev,r.ref); const movs=LIBRO.filter(m=>m.ev===ev.id&&m.ref===r.ref);
        let accion='';
        if(canWrite()){ if(st==='Reservado') accion = `<button class="btn sm" data-despachar="${ev.id}|${r.ref}">${t.reut===false?'Consumir':'Despachar'}</button>`; else if(st==='En uso') accion = `<button class="btn sm" data-reingresar="${ev.id}|${r.ref}">Reingresar</button>`; }
        return `<tr><td><div class="name2">${vLabel(v)}${t.reut===false?' '+tag('No reutilizable','fin'):''}</div><div class="code">${v.id}</div></td><td class="r n">${fmt(r.qty)} ${t.unidad}</td><td>${estadoTag(st)}</td>
          <td class="sec">${movs.length?movs.map(m=>`${fdate(m.fecha)} ${TIPO_LBL[m.tipo].toLowerCase()} ${m.qty>0?'+':''}${fmt(m.qty)} en ${secLabel(m.sec)}`).join('<br>'):'—'}</td><td class="r n">${accion}</td></tr>`;}).join('')}</tbody>
    </table></div></div>`;
    return acc(`ev|${ev.id}|${kk}|${f}`, 3, f, nItems(fr.length), tabla);
  }).join('') : '<div class="empty">Sin material de este tipo reservado para el evento.</div>';
  return acc(`ev|${ev.id}|${kk}`, 2, label, nItems(rs.length), body);
}

function pageEventos(){
  const evs = EVENTOS.slice().sort((a,b)=>a.armado.localeCompare(b.armado));
  const sinStock = [];
  EVENTOS.forEach(ev=>ev.reservas.forEach(r=>{ if(estadoEn(ev,r.ref)==='Reservado' && disponible(variant(r.ref))<0) sinStock.push({ev, v:variant(r.ref), falta:-disponible(variant(r.ref))}); }));
  return `
    ${h1row('Depósitos transitorios', `${evs.length} eventos con material`, `Cada presupuesto vivo reserva material para sus fechas sin moverlo. Lo que sale, vuelve o se consume queda escrito en el libro; el estado se deduce de ahí, nunca se guarda. La misma vista aparece como solapa "Material" en el detalle del evento.`, 'evs')}
    <div class="alert info"><span class="dot"></span><div class="body"><b>Reservado</b> = comprometido, sigue en su depósito · <b>En uso</b> = salió para el evento (el equipo debe traerlo de vuelta) · <b>Reingresado</b> = volvió, a cualquier depósito · <b>Consumido</b> = no vuelve (lo no reutilizable se consume al despachar).</div></div>
    ${sinStock.length?`<div class="alert err"><span class="dot"></span><div class="body"><b>Reservado de más:</b> ${sinStock.map(x=>`${vLabel(x.v)} para ${x.ev.nombre} (faltan ${fmt(x.falta)} ${unidad(x.v)})${solicitudAbierta(x.v.id)?' <span class="sec">· solicitud en curso</span>':canWrite()?` <button class="btn text sm" data-solicitar="${x.v.id}" data-origen="RESERVA">Generar solicitud →</button>`:''}`).join(' · ')}</div></div>`:''}
    ${evs.map(ev=>{
      const open = state.openEv[ev.id] ?? false;
      const estados = ev.reservas.map(r=>estadoEn(ev,r.ref));
      const resumen = ['Reservado','En uso','Reingresado','Consumido'].map(s=>({s,n:estados.filter(e=>e===s).length})).filter(x=>x.n);
      return `<div class="card${open?' open':''}" data-ev="${ev.id}">
        <div class="chead"><div><div class="name">${ev.nombre} <span class="sec" style="font-weight:400">· ${ev.cliente}</span> <span class="chev">▶</span></div>
          <div class="sec n">Armado ${fdate(ev.armado)}${ev.armadoFin?` → ${fdate(ev.armadoFin)}`:''} · Feria ${fdate(ev.feria)} → ${fdate(ev.feriaFin)} · Desarme ${fdate(ev.desarme)}${ev.desarmeFin?` → ${fdate(ev.desarmeFin)}`:''}${(!ev.armadoFin||!ev.desarmeFin)?' <span title="Las fechas de fin son opcionales">(fin opcional sin cargar)</span>':''}</div></div>
          <div class="meta">${resumen.map(x=>estadoTag(x.s).replace('</span>',` ${x.n}</span>`)).join(' ')}</div></div>
        <div class="cbody">${eventoGrupo(ev,['RAW','SUPPLY'],'Materias primas','MP')}${eventoGrupo(ev,['MATERIAL'],'Materiales','MAT')}</div>
      </div>`;}).join('')}
  `;
}

// vista "panel" de compras: una columna por estado del circuito, una tarjeta por solicitud
function panelCompras(rows, EST, w, m){

  return `<div class="kanban">${cols.map(est=>{
    const rs = rows.filter(r=>r.estado===est); const [fam,fill]=EST[est];
    return `<div class="kcol"><div class="kcolhead">${tag(est,fam,fill)} <span class="sec">${rs.length}</span></div>
      ${rs.length?rs.map(s=>{ const v=variant(s.ref); const t=tplOf(v);
        let acc='';
        if(w && s.estado==='Solicitada') acc = `<button class="btn text sm" data-cotizar="${s.id}">Cargar cotización</button> <button class="btn text sm danger" data-cancelar="${s.id}">Cancelar</button>`;
        else if(w && s.estado==='Cotizada') acc = `<button class="btn sm" data-recibir="${s.id}">Confirmar pago y recibir</button>`;
        return `<div class="kcard" data-sol="${s.id}"><div class="khead"><span class="code">${s.id}</span><span class="sec n">${fdate(s.recibida||s.cotizada||s.creada)}</span></div>
          <div class="name2" style="font-weight:600">${vLabel(v)}</div><div class="code">${v.id} · ${kindTag(t.kind)}</div>
          <div class="kmeta"><span><b>${fmt(s.qty)} ${t.unidad}</b></span><span class="sec">${DEPARTAMENTOS[s.dpto]} → ${secLabel(s.destino)}</span></div>
          <div class="sec">${ORIGEN[s.origen]}${s.nota?` · ${s.nota}`:''}</div>
          ${s.proveedor?`<div>${s.proveedor}${m&&s.monto!=null?` <span class="sec n">· ${money(s.monto)} (${money(s.monto/s.qty)}/${t.unidad})</span>`:''}</div>`:''}
          ${acc?`<div class="kacts">${acc}</div>`:''}</div>`; }).join(''):'<div class="kempty">Sin solicitudes</div>'}
    </div>`; }).join('')}</div>`;
}

          <td>${s.proveedor??'—'}${m&&s.monto!=null?`<div class="sec n">${money(s.monto)} · ${money(s.monto/s.qty)}/${t.unidad}</div>`:''}</td><td class="r n">${acc}</td></tr>`;}).join('')}</tbody>

/* ───────────── WIRING ───────────── */
function wire(){
  const c = $('#content');
  $$('.card[data-fam] > .chead', c).forEach(h=>h.addEventListener('click',()=>{ const k=h.parentElement.dataset.fam; state.openFam[k] = !(state.openFam[k] ?? false); render(); }));
  $$('input[data-adj]', c).forEach(i=>i.addEventListener('change',()=>{ const fl=i.files[0]; if(!fl) return; const v=variant(i.dataset.adj); if(v.adj) URL.revokeObjectURL(v.adj.url); v.adj={name:fl.name,type:fl.type,url:URL.createObjectURL(fl)}; render(); }));
  const dB = el => state.draftB[el.closest('[data-row-detail]')?.dataset.rowDetail];
  $$('[data-ebedit]', c).forEach(b=>b.addEventListener('click',()=>{ const v=variant(b.dataset.ebedit), t=tplOf(v), tec=tecDe(v); state.draftB[v.id]={nombre:vNombre(v), color:vColor(v)||'', compra:tec.compra||'', rend:tec.rend||'', vol:tec.vol||'', peso:tec.peso||'', acopio:tec.acopio||'', campos:(v.campos||[]).map(x=>({k:x.k,val:x.val,todos:false}))}; state.editB[v.id]=true; render(); }));
  $$('input[data-eb]', c).forEach(i=>i.addEventListener('input',()=>{ state.draftB[i.closest('.detail').dataset.vid][i.dataset.eb]=i.value; }));
  $$('input[data-ebk]', c).forEach(i=>i.addEventListener('input',()=>{ state.draftB[i.closest('.detail').dataset.vid].campos[+i.dataset.ebk].k=i.value; }));
  $$('input[data-ebv]', c).forEach(i=>i.addEventListener('input',()=>{ state.draftB[i.closest('.detail').dataset.vid].campos[+i.dataset.ebv].val=i.value; }));
  $$('input[data-ebt]', c).forEach(i=>i.addEventListener('change',()=>{ state.draftB[i.closest('.detail').dataset.vid].campos[+i.dataset.ebt].todos=i.checked; }));
  $$('[data-ebadd]', c).forEach(b=>b.addEventListener('click',()=>{ state.draftB[b.dataset.ebadd].campos.push({k:'',val:'',todos:false}); render(); }));
  $$('[data-ebdel]', c).forEach(b=>b.addEventListener('click',()=>{ const id=b.closest('.detail').dataset.vid; state.draftB[id].campos.splice(+b.dataset.ebdel,1); render(); }));
  $$('[data-ebcancel]', c).forEach(b=>b.addEventListener('click',()=>{ delete state.editB[b.dataset.ebcancel]; delete state.draftB[b.dataset.ebcancel]; render(); }));
  $$('[data-ebsave]', c).forEach(b=>b.addEventListener('click',()=>{
    const v=variant(b.dataset.ebsave), t=tplOf(v), d=state.draftB[v.id], tr=x=>(x||'').trim();
    if(tr(d.nombre)) v.nombre = tr(d.nombre); else delete v.nombre;
    if(tr(d.color)) v.color = tr(d.color); else delete v.color;
    v.tec = {...(v.tec||{}), compra:tr(d.compra)||null, rend:tr(d.rend)||null, vol:tr(d.vol)||null, peso:tr(d.peso)||null, acopio:tr(d.acopio)||null};
    const campos = d.campos.filter(x=>tr(x.k)).map(x=>({k:tr(x.k), val:tr(x.val)}));
    v.campos = campos;
    d.campos.filter(x=>x.todos && tr(x.k)).forEach(x=>variantsOf(t).forEach(o=>{ if(o!==v){ o.campos = o.campos||[]; if(!o.campos.some(y=>y.k===tr(x.k))) o.campos.push({k:tr(x.k), val:''}); } }));
    delete state.editB[v.id]; delete state.draftB[v.id]; render();
  }));
  $$('textarea[data-obs]', c).forEach(t=>t.addEventListener('input',()=>{ variant(t.dataset.obs).obs = t.value; }));
  $$('[data-desc]', c).forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.desc; state.openDesc[k]=!state.openDesc[k]; render(); }));
  $$('.card[data-bajo] > .chead', c).forEach(h=>h.addEventListener('click',()=>{ const k=h.parentElement.dataset.bajo; state.openBajo[k] = !(state.openBajo[k] ?? false); render(); }));
  $$('.card[data-dep] > .chead', c).forEach(h=>h.addEventListener('click',()=>{ const k=h.parentElement.dataset.dep; state.openDep[k] = !(state.openDep[k] ?? h.parentElement.classList.contains('open')); render(); }));
  $$('.acc > .acchead', c).forEach(h=>h.addEventListener('click',e=>{ if(e.target.closest('button')) return; const k=h.parentElement.dataset.acc; state.openAcc[k] = !(state.openAcc[k] ?? false); render(); }));
  $$('.card[data-ev] > .chead', c).forEach(h=>h.addEventListener('click',()=>{ const k=h.parentElement.dataset.ev; state.openEv[k] = !(state.openEv[k] ?? h.parentElement.classList.contains('open')); render(); }));
  $$('.tpl[data-tpl] > .tplhead', c).forEach(h=>h.addEventListener('click',e=>{ if(e.target.closest('button')) return; const k=h.parentElement.dataset.tpl; state.openTpl[k] = !(state.openTpl[k] ?? false); render(); }));
  $$('tr.row[data-row]', c).forEach(r=>r.addEventListener('click',e=>{ if(e.target.closest('button')) return; state.openRow[r.dataset.row]=!state.openRow[r.dataset.row]; render(); }));
  $$('[data-chip]', c).forEach(b=>b.addEventListener('click',()=>{ const [k,f]=b.dataset.chip.split('|'); state.chip[k] = state.chip[k]===f?null:f; render(); }));
  $$('[data-chipall]', c).forEach(b=>b.addEventListener('click',()=>{ state.chip[b.dataset.chipall] = null; render(); }));
  const d=$('#desde',c), h=$('#hasta',c);
  if(d){ d.addEventListener('change',()=>{state.desde=d.value; render();}); h.addEventListener('change',()=>{state.hasta=h.value; render();}); $('#rangeClear',c).addEventListener('click',()=>{state.desde='';state.hasta='';render();}); }
  const q=$('#q',c); if(q) q.addEventListener('input',()=>{ state.q = q.value; const pos = q.selectionStart; render(); const nq=$('#q'); if(nq){ nq.focus(); try{ nq.setSelectionRange(pos,pos); }catch(e){} } });
  const on=(sel,fn)=>$$(sel,c).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation(); fn(b);}));
  on('[data-solicitar]', b=>modalSolicitud(b.dataset.solicitar, b.dataset.origen||'MIN_GLOBAL'));
  on('[data-transferir]', b=>modalTransferir(b.dataset.transferir, b.dataset.from, b.dataset.to));
  on('[data-producir]', b=>modalProducir(b.dataset.producir));
  on('[data-receta]', b=>modalReceta(b.dataset.receta));
  on('[data-edittpl]', b=>drawerPlantilla(b.dataset.edittpl));
  on('[data-newtpl]', b=>drawerPlantilla(null, b.dataset.newtpl));
  on('[data-ejes]', b=>drawerPlantilla(b.dataset.ejes, null, 'ejes'));
  on('[data-comp]', b=>drawerPlantilla(b.dataset.comp, null, 'comp'));
  on('[data-newvar]', b=>modalNuevaVariante(b.dataset.newvar));
  on('[data-editvar]', b=>modalEditarVariante(b.dataset.editvar));
  on('[data-despachar]', b=>{ const [ev,ref]=b.dataset.despachar.split('|'); modalDespachar(ev,ref); });
  on('[data-reingresar]', b=>{ const [ev,ref]=b.dataset.reingresar.split('|'); modalReingresar(ev,ref); });
  on('[data-cotizar]', b=>modalCotizar(b.dataset.cotizar));
  on('[data-recibir]', b=>recibir(b.dataset.recibir));
  on('[data-cancelar]', b=>confirmar('Cancelar la solicitud', `Se cancela ${b.dataset.cancelar}. No mueve stock.`, 'Sí, cancelar', ()=>{ const s=SOLICITUDES.find(x=>x.id===b.dataset.cancelar); s.estado='Cancelada'; toast(`Solicitud ${s.id} cancelada`); render(); }, true));
  on('[data-resp]', b=>modalResponsable(b.dataset.resp));
  $$('[data-cvista]', c).forEach(b=>b.addEventListener('click',()=>{ state.comprasVista=b.dataset.cvista; render(); }));
  const qk=$('#qk',c); if(qk) qk.addEventListener('input',()=>{ state.qk = qk.value; const pos = qk.selectionStart; render(); const nq=$('#qk'); if(nq){ nq.focus(); try{ nq.setSelectionRange(pos,pos); }catch(e){} } });
  $$('[data-sol]', c).forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('button')) return; fichaSolicitud(el.dataset.sol); }));
  const ns=$('#nuevaSol',c); if(ns) ns.addEventListener('click',()=>modalSolicitud(null,'MANUAL'));
  const nd=$('#nuevoDep',c); if(nd) nd.addEventListener('click',()=>toast('Alta de depósito: nombre y dirección, luego sus secciones.'));
  const nsec=$('#nuevaSeccion',c); if(nsec) nsec.addEventListener('click',()=>modalSeccion());
}

/* ───────────── DRAWER / MODALES ───────────── */
function openModal(html, center=false){ const m=$('#modal'); m.className='modal'+(center?' center':''); m.innerHTML = html; $('#overlay').classList.add('on'); $$('[data-close]').forEach(b=>b.addEventListener('click',closeModal)); const f=$('#modal input,#modal select'); if(f) f.focus(); }
function closeModal(){ $('#overlay').classList.remove('on'); }
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function confirmar(titulo, desc, ok, fn, danger){ openModal(`<h2>${titulo}</h2><p class="desc">${desc}</p><div class="mfoot"><button class="btn" data-close>Cancelar</button><button class="btn primary${danger?' danger':''}" id="mok">${ok}</button></div>`, true); $('#mok').addEventListener('click',()=>{ closeModal(); fn(); }); }
const secOptions = (filter=()=>true, sel) => SECCIONES.filter(filter).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${secLabel(s.id)}${s.resp?` — ${s.resp}`:''}</option>`).join('');
const varOptions = (filter=()=>true, sel) => VARIANTS.filter(filter).map(v=>`<option value="${v.id}" ${v.id===sel?'selected':''}>${vLabel(v)} · ${v.id} · ${KIND[tplOf(v).kind]}</option>`).join('');

// ── el drawer de la plantilla: General / Ejes y valores / Variantes / Receta o Componentes ──

  const t = id ? tpl(id) : {id:'', nombre:'', kind:kindNew||'MATERIAL', fam:'', rubro:'', unidad:'u', reut:true, sellable:false, ejes:[], comp:[]};

  const tabs = [['general','General'],['ejes',`Ejes y valores${t.ejes.length?` (${t.ejes.length})`:''}`],['vars',`Variantes (${id?variantsOf(t).length:0})`], ...(t.kind==='KIT'?[['comp',`Componentes (${id?variantsOf(t).length:0} ítems)`]]:[]), ...(t.kind==='MATERIAL'?[['receta','Recetas']]:[])];

    general: `<div class="field"><label>Clase</label><div class="radio">${Object.entries(KIND).map(([k,v])=>`<label class="${t.kind===k?'on':''}"><input type="radio" name="kind" value="${k}" ${t.kind===k?'checked':''} ${!w?'disabled':''}>${v}</label>`).join('')}</div><div class="hint">Una sola clase por plantilla. Un kit no lleva familia; los demás sí.</div></div>

      <div class="fgrid"><div class="field"><label>Unidad</label><input value="${t.unidad}" ${!w?'disabled':''}></div><div class="field"><label>Mínimos</label><div class="hint" style="margin-top:8px">Se cargan por variante: el mínimo total en "Editar variante", el mínimo por sección en cada fila de stock.</div></div></div>
      <div class="check"><input type="checkbox" id="tSell" ${t.sellable?'checked':''} ${!w?'disabled':''}><label for="tSell">Vendible: entra a los presupuestos como línea propia</label></div>
      ${t.kind!=='KIT'?`<div class="check"><input type="checkbox" id="tReut" ${t.reut!==false?'checked':''} ${!w?'disabled':''}><label for="tReut">Reutilizable: vuelve del evento (si no, se consume al despachar)</label></div>`:''}
      <div class="field"><label>Descripción <span class="opt">(opcional)</span></label><textarea rows="2" ${!w?'disabled':''}>${t.desc??''}</textarea></div>

  openModal(`<h2>Desarme: ¿a qué depósito vuelve?</h2><p class="desc">${fmt(salio)} ${t.unidad} de ${vLabel(v)}, de "${ev.nombre}". Puede volver a otro depósito que el de origen.</p>
    <div class="mbody"><div class="field"><label>Depósito › sección</label><select id="rSec">${secOptions(s=>s.dpto===sec(v.stock[0].sec).dpto)}</select></div>
      <div class="field"><label>Cantidad que vuelve</label><input id="rQty" type="number" min="0" step="any" value="${salio}"><div class="hint">Lo que no vuelve se anota como consumido (rotura, pérdida) y queda en el libro.</div></div></div>
    <div class="mfoot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="mok">Confirmar reingreso</button></div>`, true);
  $('#mok').addEventListener('click',()=>{ const s=$('#rSec').value, q=Math.min(salio, Math.max(0, parseFloat($('#rQty').value)||0)); let dst=v.stock.find(x=>x.sec===s); if(!dst){ dst={sec:s,qty:0,min:null}; v.stock.push(dst); } if(q>0){ dst.qty+=q; LIBRO.push({id:nextLibroId++, fecha:'2026-09-18', tipo:'REINGRESO', ref:v.id, sec:s, qty:+q, ev:ev.id, quien:'Vos'}); } if(salio-q>0) LIBRO.push({id:nextLibroId++, fecha:'2026-09-18', tipo:'CONSUMO', ref:v.id, sec:s, qty:-(salio-q), ev:ev.id, quien:'Vos', nota:'no volvió del evento'}); closeModal(); toast(`${fmt(q)} ${t.unidad} de ${vLabel(v)} reingresados a ${secLabel(s)}${salio-q>0?`; ${fmt(salio-q)} anotados como consumidos`:''}`); render(); });
}
// ficha de la solicitud: todo lo que se sabe de un pedido de compra, con su línea de tiempo y el stock actual del ítem
function fichaSolicitud(id){
  const s=SOLICITUDES.find(x=>x.id===id), v=variant(s.ref), t=tplOf(v), u=t.unidad, w=canWrite(), m=canMontos();
  const EST = {Solicitada:['pr',true], Cotizada:['contacto',true], Recibida:['expo',false], Cancelada:['fin',false]};
  const [fam,fill]=EST[s.estado];
  const fi=fisico(v), re=reservado(v.id);
  const pasos = [
    {l:'Solicitada', d:s.creada, on:true},
    {l:'Cotizada', d:s.cotizada, on:!!s.cotizada},
    s.estado==='Cancelada' ? {l:'Cancelada', d:null, on:true, bad:true} : {l:'Recibida', d:s.recibida, on:!!s.recibida}
  ];
  const fila = (k,val) => `<div style="display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border2)"><span class="sec" style="width:150px;flex:none">${k}</span><span style="flex:1">${val}</span></div>`;
  const acciones = !w ? '' : s.estado==='Solicitada' ? `<button class="btn text danger" id="fCancelar">Cancelar solicitud</button><button class="btn primary" id="fCotizar">Cargar cotización</button>` : s.estado==='Cotizada' ? `<button class="btn primary" id="fRecibir">Confirmar pago y recibir</button>` : '';
  openModal(`<h2>Solicitud ${s.id} ${tag(s.estado,fam,fill)}</h2>
    <p class="desc">${fmt(s.qty)} ${u} de ${vLabel(v)}</p>
    <div class="mbody">
      <h4 style="margin:12px 0 6px;font-size:12px">Línea de tiempo</h4>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${pasos.map(p=>`<div style="flex:1;min-width:120px;padding:8px 10px;border-radius:8px;border:1px solid ${p.on?(p.bad?'var(--baja-b)':'var(--primary)'):'var(--border2)'};background:${p.on?(p.bad?'var(--baja-bg)':'var(--primary-bg)'):'var(--item-bg)'};opacity:${p.on?1:.6}"><div style="font-weight:700;font-size:12px">${p.l}</div><div class="sec n">${p.d?fdate(p.d):(p.on?'—':'pendiente')}</div></div>`).join('')}</div>
      <h4 style="margin:12px 0 2px;font-size:12px">Pedido</h4>
      ${fila('Ítem', `<b>${vLabel(v)}</b> <span class="code">${v.id}</span> ${kindTag(t.kind)}`)}
      ${fila('Cantidad', `${fmt(s.qty)} ${u}`)}
      ${fila('Área solicitante', DEPARTAMENTOS[s.dpto])}
      ${fila('Destino', secLabel(s.destino))}
      ${fila('Origen', `${ORIGEN[s.origen]}${s.nota?`<div class="sec">${s.nota}</div>`:''}`)}
      <h4 style="margin:14px 0 2px;font-size:12px">Compra</h4>
      ${fila('Proveedor', s.proveedor ?? '<span class="sec">sin cotización todavía</span>')}
      ${m ? fila('Monto', s.monto!=null ? `${money(s.monto)} <span class="sec">· ${money(s.monto/s.qty)} por ${u}</span>` : '<span class="sec">—</span>') : ''}
      <h4 style="margin:14px 0 2px;font-size:12px">Stock actual del ítem</h4>
      ${fila('Físico total', `${fmt(fi)} ${u}${v.minG!=null?` <span class="sec">· mín. ${fmt(v.minG)}</span>`:''}`)}
      ${fila('Reservado / disponible', `${re?fmt(re):'—'} / ${fmt(fi-re)} ${u}`)}
      ${fila('Por almacén', (v.stock||[]).length ? v.stock.map(x=>`${secLabel(x.sec)}: <b>${fmt(x.qty)}</b>`).join('<br>') : '<span class="sec">sin stock cargado</span>')}
    </div>
    <div class="mfoot"><button class="btn" data-close>Cerrar</button>${acciones}</div>`);
  const on=(sel,fn)=>{ const b=$(sel); if(b) b.addEventListener('click',fn); };
  on('#fCotizar',()=>modalCotizar(s.id));
  on('#fRecibir',()=>recibir(s.id));
  on('#fCancelar',()=>confirmar('Cancelar la solicitud', `Se cancela ${s.id}. No mueve stock.`, 'Sí, cancelar', ()=>{ s.estado='Cancelada'; toast(`Solicitud ${s.id} cancelada`); render(); }, true));
}

function modalCotizar(id){
  const s=SOLICITUDES.find(x=>x.id===id), v=variant(s.ref);
  openModal(`<h2>Cargar cotización</h2><p class="desc">${fmt(s.qty)} ${unidad(v)} de ${vLabel(v)}, pedido por ${DEPARTAMENTOS[s.dpto]}.</p>
    <div class="mbody"><div class="field"><label>Proveedor</label><input id="cProv" placeholder="Ej. Aluminios del Sur"></div>
    ${canMontos()?'<div class="field"><label>Monto total cotizado (ARS)</label><input id="cMonto" type="number" min="0" step="any"></div>':'<div class="field"><label>Monto total cotizado</label><div class="hint">Tu usuario no ve montos: el monto lo carga quien sí los ve. La cotización queda registrada igual.</div></div>'}
    <div class="err" id="cErr"></div></div>
    <div class="mfoot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="mok">Enviar a Administración</button></div>`, true);
  $('#mok').addEventListener('click',()=>{ const p=$('#cProv').value.trim(); if(!p){ $('#cErr').textContent='El proveedor es obligatorio.'; return; } s.proveedor=p; if(canMontos()){ const m=parseFloat($('#cMonto').value); if(!(m>0)){ $('#cErr').textContent='Ingresá un monto mayor a cero.'; return; } s.monto=m; } s.estado='Cotizada'; s.cotizada='2026-09-18'; closeModal(); toast('Cotización cargada. Pendiente de que se confirme el pago.'); render(); });
}
function recibir(id){
  const s=SOLICITUDES.find(x=>x.id===id), v=variant(s.ref), u=unidad(v);
  confirmar('Confirmar pago y recibir', `${fmt(s.qty)} ${u} de ${vLabel(v)} entran a ${secLabel(s.destino)}${s.monto!=null?` y el costo de reposición pasa a ${money(s.monto/s.qty)} por ${u}`:''}. Es el único paso que escribe stock.`, 'Sí, recibir', ()=>{ let dst=v.stock.find(x=>x.sec===s.destino); if(!dst){ dst={sec:s.destino,qty:0,min:null}; v.stock.push(dst); } dst.qty+=s.qty; if(s.monto!=null){ v.costo=s.monto/s.qty; v.costoAt='2026-09-18'; } LIBRO.push({id:nextLibroId++, fecha:'2026-09-18', tipo:'COMPRA', ref:v.id, sec:s.destino, qty:+s.qty, nota:`${s.proveedor}${s.monto!=null?' · '+money(s.monto):''}`, quien:'Compras'}); s.estado='Recibida'; s.recibida='2026-09-18'; toast(`${fmt(s.qty)} ${u} de ${vLabel(v)} ingresaron a ${secLabel(s.destino)}.${s.monto!=null&&canMontos()?` Costo de reposición: ${money(s.monto/s.qty)}/${u}.`:''}`); render(); });
}
function modalResponsable(secId){
  const s=sec(secId);
  openModal(`<h2>Responsable de la sección</h2><p class="desc">${secLabel(secId)}. Es un empleado de RRHH, no un texto libre.</p>
    <div class="mbody"><div class="field"><label>Empleado</label><select id="rEmp"><option value="">— Sin responsable —</option>${['GÓMEZ, Juan','SUÁREZ, Marta','PÉREZ, Luis','DÍAZ, Pablo','FERRARI, Lucía','RÍOS, Carla','LÓPEZ, Ana','MOLINA, Sofía'].map(e=>`<option ${s.resp===e?'selected':''}>${e}</option>`).join('')}</select></div></div>
    <div class="mfoot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="mok">Guardar</button></div>`, true);
  $('#mok').addEventListener('click',()=>{ s.resp=$('#rEmp').value||null; closeModal(); toast(s.resp?`${s.resp} es responsable de ${secLabel(secId)}`:`${secLabel(secId)} quedó sin responsable`); render(); });
}
function modalSeccion(){
  openModal(`<h2>Nueva sección</h2><p class="desc">Una sección es un depósito × un departamento. No puede repetirse.</p>
    <div class="mbody"><div class="field"><label>Depósito</label><select id="sDep">${DEPOSITOS.map(d=>`<option value="${d.id}">${d.nombre}</option>`).join('')}</select></div>
    <div class="field"><label>Departamento</label><select id="sDpto">${Object.entries(DEPARTAMENTOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    <div class="field"><label>Responsable <span class="opt">(opcional)</span></label><select id="sResp"><option value="">— Sin responsable —</option><option>MOLINA, Sofía</option><option>GÓMEZ, Juan</option></select></div><div class="err" id="sErr"></div></div>
    <div class="mfoot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="mok">Crear sección</button></div>`, true);
  $('#mok').addEventListener('click',()=>{ const id=`${$('#sDep').value}-${$('#sDpto').value}`; if(sec(id)){ $('#sErr').textContent='Ese depósito ya tiene una sección para ese departamento.'; return; } SECCIONES.push({id, dep:$('#sDep').value, dpto:$('#sDpto').value, resp:$('#sResp').value||null}); state.openDep[$('#sDep').value]=true; closeModal(); toast(`Sección ${secLabel(id)} creada`); render(); });
}

/* ───────────── TOAST ───────────── */
function toast(text, undo){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span class="dot"></span><span>${text}</span>${undo?'<button class="undo">Deshacer</button>':''}`; $('#toasts').appendChild(t); if(undo) t.querySelector('.undo').addEventListener('click',()=>{ t.remove(); undo(); }); setTimeout(()=>t.remove(), undo?9000:4500); }

/* ───────────── ARRANQUE ───────────── */
$('#viewAs').addEventListener('change',e=>{ state.viewAs=e.target.value; render(); toast(state.viewAs==='reader'?'Solo lectura: sin controles que escriban, mismas cifras.':state.viewAs==='nomontos'?'Sin montos: costo de reposición, precios de lista y montos de compras desaparecen; las cantidades quedan.':'Administrador: lectura, escritura y montos.'); });
$('#themeBtn').addEventListener('click',()=>{ const r=document.documentElement; const dark = r.dataset.theme==='dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dark?'light':'dark'; });
render();
</script>
